version: '3.9'

networks:
  cesizen-net:
    driver: bridge

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-cesizen
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql-db
      DB_PORT: 5432
      DB_DATABASE: app_db
      DB_USERNAME: app_user
      DB_PASSWORD: secret
    ports:
      - "80:8000"
    networks:
      - cesizen-net
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: pgsql-db
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cesizen-net

volumes:
  pgdata:

